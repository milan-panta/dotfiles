# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-tui spotify_player

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-or-focus-webapp Calendar "https://calendar.google.com/calendar/u/0/r"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L

unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN

unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN

bindd = SUPER, M, Full width, fullscreen, 1

# Focus with SUPER + hjkl
bindd = SUPER, H, Move window focus left, movefocus, l
bindd = SUPER, L, Move window focus right, movefocus, r
bindd = SUPER, K, Move window focus up, movefocus, u
bindd = SUPER, J, Move window focus down, movefocus, d

# Move window with SUPER + SHIFT + hjkl
bindd = SUPER SHIFT, H, Move window left, movewindow, l
bindd = SUPER SHIFT, L, Move window right, movewindow, r
bindd = SUPER SHIFT, K, Move window up, movewindow, u
bindd = SUPER SHIFT, J, Move window down, movewindow, d

bindd = SUPER CTRL, K, Show key bindings, exec, omarchy-menu-keybindings

# Media controls (Fn+arrows aren't interceptable; use SUPER+arrows instead)
bindd = SUPER, LEFT, Previous track, exec, omarchy-swayosd-client --playerctl previous
bindd = SUPER, RIGHT, Next track, exec, omarchy-swayosd-client --playerctl next
bindd = SUPER, UP, Play/pause, exec, omarchy-swayosd-client --playerctl play-pause

unbind = SUPER, TAB
bind = SUPER, TAB, focuscurrentorlast

# Custom battery bind to show power profile
unbind = SUPER CTRL ALT, B
bindd = SUPER CTRL ALT, B, Show battery remaining and profile, exec, notify-send -u low "$(omarchy-battery-status)" "Power Profile: $(powerprofilesctl get 2>/dev/null)"
