[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pytest", "debugpy"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = ["--doctest-modules", "--import-mode=importlib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
