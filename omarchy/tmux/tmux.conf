# Prefix
set -g prefix M-a

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# General
set-option -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -ag terminal-overrides ",xterm-ghostty:Tc"

# Avoid textbox/cursor flicker with foot's synchronized redraw path.
# Foot uses TERM=foot; other terminals keep synchronized updates.
set -as terminal-overrides ",foot*:Sync@"

set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -gq allow-passthrough on
set -g status-interval 5
set -g set-clipboard on
setw -g aggressive-resize on
set-option -g bell-action none
set-option -g visual-bell off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 10

# Split pane keys
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

bind-key x kill-pane
bind b set-option -g status # hide statusbar

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind X kill-session
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n
bind-key -n M-\; run-shell "sesh last >/dev/null 2>&1 || tmux display-message 'No last session'"

# Resize panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Swap pane in vim direction
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Window / pane shortcuts
bind -n M-w kill-pane
bind -n M-t new-window -c "#{pane_current_path}"
# Move the pane to window N: prefix m then N, or Alt+Shift+N (pairs with Alt+N to go there).
# A window that doesn't exist yet is created after the last one (scripts/move-pane.sh).
bind m command-prompt -1 -p "Move pane to window:" "run-shell '~/.config/tmux/scripts/move-pane.sh %1'"
bind -n M-! run-shell '~/.config/tmux/scripts/move-pane.sh 1'
bind -n M-S-1 run-shell '~/.config/tmux/scripts/move-pane.sh 1'
bind -n M-@ run-shell '~/.config/tmux/scripts/move-pane.sh 2'
bind -n M-S-2 run-shell '~/.config/tmux/scripts/move-pane.sh 2'
bind -n "M-#" run-shell '~/.config/tmux/scripts/move-pane.sh 3'
bind -n M-S-3 run-shell '~/.config/tmux/scripts/move-pane.sh 3'
bind -n "M-$" run-shell '~/.config/tmux/scripts/move-pane.sh 4'
bind -n M-S-4 run-shell '~/.config/tmux/scripts/move-pane.sh 4'
bind -n "M-%" run-shell '~/.config/tmux/scripts/move-pane.sh 5'
bind -n M-S-5 run-shell '~/.config/tmux/scripts/move-pane.sh 5'
bind -n M-^ run-shell '~/.config/tmux/scripts/move-pane.sh 6'
bind -n M-S-6 run-shell '~/.config/tmux/scripts/move-pane.sh 6'
bind -n M-& run-shell '~/.config/tmux/scripts/move-pane.sh 7'
bind -n M-S-7 run-shell '~/.config/tmux/scripts/move-pane.sh 7'
bind -n M-* run-shell '~/.config/tmux/scripts/move-pane.sh 8'
bind -n M-S-8 run-shell '~/.config/tmux/scripts/move-pane.sh 8'
bind -n M-( run-shell '~/.config/tmux/scripts/move-pane.sh 9'
bind -n M-S-9 run-shell '~/.config/tmux/scripts/move-pane.sh 9'

# Lazygit popup
bind -n M-g display-popup -d "#{pane_current_path}" -w 100% -h 99% -y 0% -B -E 'lazygit'

# Yazi window: Alt+y opens at the pane's cwd; Alt+y or q in Yazi closes it.
bind -n M-y new-window -c "#{pane_current_path}" -n "yazi" 'yazi'

# Sesh
bind-key -n M-f run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# set-clipboard sends the copy to the terminal (OSC 52), so no copy command is needed.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Theme
# tmux 3.8 defaults this to underscore; "default" falls back to window-status-style like 3.7 did
setw -g window-status-current-style default
# tmux 3.8 picks theme* colours from the terminal's light/dark report, but Ghostty 1.3
# always reports "light" (DSR 997;2), giving gray45 popups. Map them to the terminal's
# ANSI palette instead, so they follow whatever the omarchy theme sets.
set -s theme terminal
# 3.8 gives popups/menus a themedarkgrey background; keep them on the terminal bg like 3.7.
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g menu-border-style default
source-file -q ~/.local/state/omarchy/current/theme/tmux-theme.conf

# Vim-tmux-navigator: Alt+h/j/k/l. Whether Neovim (or fzf) is in front comes from tmux's own
# #{pane_current_command}: no `ps | grep` process per key press (~20ms each).
is_vim='#{m/ri:^(g?(view|l?n?vim?x?)(diff)?|fzf)$,#{pane_current_command}}'
bind-key -n M-h if-shell -F "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell -F "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell -F "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell -F "$is_vim" 'send-keys M-l' 'select-pane -R'

# Resize: in Neovim these resize its splits, and the tmux pane once there's no split
# that way (lua/config/keymaps.lua). Elsewhere they resize the pane.
# Alt+Shift+h/j/k/l, next to Alt+h/j/k/l for moving between panes. With extended keys,
# Ghostty sends these as M-S-H…; the legacy encoding arrives as M-H…. Both are bound.
bind-key -n M-H   if-shell -F "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind-key -n M-J   if-shell -F "$is_vim" 'send-keys M-J' 'resize-pane -D 5'
bind-key -n M-K   if-shell -F "$is_vim" 'send-keys M-K' 'resize-pane -U 5'
bind-key -n M-L   if-shell -F "$is_vim" 'send-keys M-L' 'resize-pane -R 5'
bind-key -n M-S-H if-shell -F "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind-key -n M-S-J if-shell -F "$is_vim" 'send-keys M-J' 'resize-pane -D 5'
bind-key -n M-S-K if-shell -F "$is_vim" 'send-keys M-K' 'resize-pane -U 5'
bind-key -n M-S-L if-shell -F "$is_vim" 'send-keys M-L' 'resize-pane -R 5'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
